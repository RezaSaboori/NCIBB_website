server {
    listen 80;
    server_name ncibb.cardiosmart.ai;

    return 301 https://ncibb.cardiosmart.ai$request_uri;
}

server {
    # The host's Nginx stream listener forwards this SNI name to port 4443.
    listen 127.0.0.1:4443 ssl http2;
    server_name ncibb.cardiosmart.ai;
    port_in_redirect off;

    ssl_certificate /etc/nginx/tls/ncibb.cardiosmart.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/ncibb.cardiosmart.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /storage03/Saboori/NCIBB_website/frontend/dist;
    index index.html;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Use the production Django service on this loopback port.
    location /api/ {
        proxy_pass http://127.0.0.1:8317;
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8317;
    }

    location /static/ {
        alias /storage03/Saboori/NCIBB_website/backend/staticfiles/;
    }

    location /media/ {
        alias /storage03/Saboori/NCIBB_website/backend/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
