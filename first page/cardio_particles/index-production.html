<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cardio Particle System - Production</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Production-only styles - no controls */
    #info {
      display: none; /* Hide particle count info */
    }
    
  </style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<script type="module">
  // Import config utilities for advanced usage
  import { CONFIG, PRESETS, applyPreset, getFlatConfig } from './js/config.js';
  
  // Example: Detect device and apply appropriate preset
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  const isLowPerformance = isMobile || navigator.hardwareConcurrency < 4;
  
  if (isLowPerformance) {
    console.log('Low-performance device detected, applying minimal preset');
    // You could dynamically modify CONFIG here before main.js loads
    CONFIG.ambientType1.count = 2000;
    CONFIG.ambientType2.count = 1000;
    CONFIG.heart.heartDensity = 0.2;
  }
  
  // Optional: Load custom config from URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  const presetName = urlParams.get('preset');
  if (presetName && PRESETS[presetName]) {
    console.log(`Applying preset: ${presetName}`);
    const currentConfig = getFlatConfig();
    const presetConfig = applyPreset(presetName, currentConfig);
    Object.assign(CONFIG.heart, presetConfig.heart || {});
    Object.assign(CONFIG.ambientType1, presetConfig.ambientType1 || {});
    Object.assign(CONFIG.ambientType2, presetConfig.ambientType2 || {});
  }
</script>

<!-- Main application (uses config.js) -->
<script type="module" src="js/main.js"></script>

<!-- 
  USAGE EXAMPLES:
  
  1. Default configuration:
     https://yoursite.com/
  
  2. With preset:
     https://yoursite.com/?preset=calm
     https://yoursite.com/?preset=energetic
     https://yoursite.com/?preset=minimal
     https://yoursite.com/?preset=maximum
  
  3. Custom configuration:
     Edit js/config.js before deployment
-->
</body>
</html>
